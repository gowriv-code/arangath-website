<svg viewBox="0 0 560 280" width="1120" height="560" role="img" xmlns="http://www.w3.org/2000/svg">
            <rect width="560" height="280" fill="#070F18"/>
            <!-- Grid overlay — BIM viewport feel -->
            <line x1="0" y1="140" x2="560" y2="140" stroke="rgba(74,170,210,0.06)" stroke-width="0.5"/>
            <line x1="280" y1="0" x2="280" y2="280" stroke="rgba(74,170,210,0.06)" stroke-width="0.5"/>
            <!-- River bed -->
            <rect x="0" y="220" width="560" height="60" fill="#081420"/>
            <line x1="0" y1="220" x2="560" y2="220" stroke="rgba(61,201,160,0.2)" stroke-width="0.8"/>
            <!-- Water surface ripple lines -->
            <line x1="20" y1="232" x2="120" y2="232" stroke="rgba(74,170,210,0.15)" stroke-width="0.5"/>
            <line x1="160" y1="238" x2="280" y2="238" stroke="rgba(74,170,210,0.12)" stroke-width="0.5"/>
            <line x1="320" y1="234" x2="440" y2="234" stroke="rgba(74,170,210,0.15)" stroke-width="0.5"/>
            <line x1="80" y1="248" x2="200" y2="248" stroke="rgba(74,170,210,0.1)" stroke-width="0.5"/>
            <line x1="360" y1="252" x2="500" y2="252" stroke="rgba(74,170,210,0.1)" stroke-width="0.5"/>

            <!-- Bridge deck — main span, perspective slightly off centre -->
            <rect x="0" y="174" width="560" height="12" fill="#0F2235" stroke="#4AAAD2" stroke-width="0.8"/>
            <!-- Road surface markings -->
            <line x1="0" y1="180" x2="560" y2="180" stroke="rgba(255,255,255,0.06)" stroke-width="4"/>
            <line x1="100" y1="174" x2="100" y2="186" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
            <line x1="200" y1="174" x2="200" y2="186" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
            <line x1="300" y1="174" x2="300" y2="186" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
            <line x1="400" y1="174" x2="400" y2="186" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
            <line x1="500" y1="174" x2="500" y2="186" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

            <!-- Pier columns — 7 visible piers -->
            <g fill="#0D2030" stroke="#4AAAD2" stroke-width="0.8">
              <rect x="40" y="186" width="18" height="34"/>
              <rect x="120" y="186" width="18" height="34"/>
              <rect x="200" y="186" width="18" height="34"/>
              <rect x="280" y="186" width="18" height="34"/>
              <rect x="360" y="186" width="18" height="34"/>
              <rect x="440" y="186" width="18" height="34"/>
              <rect x="510" y="186" width="18" height="34"/>
            </g>

            <!-- Regulator sluice gates — teal highlight on selected span -->
            <rect x="200" y="188" width="18" height="28" fill="#0D2030" stroke="#3DC9A0" stroke-width="1.2"/>
            <rect x="280" y="188" width="18" height="28" fill="#0D2030" stroke="#3DC9A0" stroke-width="1.2"/>
            <!-- Gate mechanism lines -->
            <line x1="204" y1="192" x2="214" y2="212" stroke="#3DC9A0" stroke-width="0.8" opacity="0.6"/>
            <line x1="284" y1="192" x2="294" y2="212" stroke="#3DC9A0" stroke-width="0.8" opacity="0.6"/>

            <!-- Pier footings underwater -->
            <g fill="#081825" stroke="rgba(74,170,210,0.3)" stroke-width="0.5">
              <rect x="36" y="220" width="26" height="20"/>
              <rect x="116" y="220" width="26" height="20"/>
              <rect x="196" y="220" width="26" height="20"/>
              <rect x="276" y="220" width="26" height="20"/>
              <rect x="356" y="220" width="26" height="20"/>
              <rect x="436" y="220" width="26" height="20"/>
              <rect x="506" y="220" width="26" height="20"/>
            </g>

            <!-- Clash detection indicator -->
            <rect x="196" y="182" width="26" height="8" fill="none" stroke="#3DC9A0" stroke-width="1" stroke-dasharray="2,2"/>
            <circle cx="209" cy="172" r="5" fill="rgba(61,201,160,0.15)" stroke="#3DC9A0" stroke-width="1"/>
            <text x="218" y="175" font-family="'DM Mono', monospace" font-size="7" fill="#3DC9A0" letter-spacing="0.05em">COORD. PT</text>

            <!-- BIM layer indicators — top right -->
            <g transform="translate(420, 14)">
              <rect x="0" y="0" width="8" height="5" fill="#4AAAD2" opacity="0.7"/>
              <text x="12" y="5" font-family="'DM Mono', monospace" font-size="7" fill="rgba(74,170,210,0.7)">CIVIL</text>
              <rect x="0" y="10" width="8" height="5" fill="#3DC9A0" opacity="0.7"/>
              <text x="12" y="15" font-family="'DM Mono', monospace" font-size="7" fill="rgba(61,201,160,0.7)">STRUCTURAL</text>
              <rect x="0" y="20" width="8" height="5" fill="rgba(255,180,50,0.6)"/>
              <text x="12" y="25" font-family="'DM Mono', monospace" font-size="7" fill="rgba(255,180,50,0.6)">HYDRAULIC</text>
            </g>

            <!-- Dimension annotation -->
            <line x1="40" y1="155" x2="520" y2="155" stroke="rgba(74,170,210,0.3)" stroke-width="0.5"/>
            <line x1="40" y1="150" x2="40" y2="160" stroke="rgba(74,170,210,0.4)" stroke-width="0.8"/>
            <line x1="520" y1="150" x2="520" y2="160" stroke="rgba(74,170,210,0.4)" stroke-width="0.8"/>
            <text x="280" y="152" font-family="'DM Mono', monospace" font-size="7" fill="rgba(74,170,210,0.5)" text-anchor="middle">978m — 70 SPANS</text>

            <!-- Viewport label -->
            <text x="14" y="16" font-family="'DM Mono', monospace" font-size="8" fill="rgba(74,170,210,0.4)" letter-spacing="0.1em">ELEVATION — STRUCTURAL</text>
            <text x="14" y="26" font-family="'DM Mono', monospace" font-size="7" fill="rgba(200,225,248,0.2)" letter-spacing="0.08em">LOD 350 · ISO 19650</text>
          </svg>