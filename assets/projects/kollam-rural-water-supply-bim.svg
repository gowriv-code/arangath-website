<svg viewBox="0 0 560 280" width="1120" height="560" role="img" xmlns="http://www.w3.org/2000/svg">
            <rect width="560" height="280" fill="#070F18"/>
            <!-- Grid -->
            <line x1="0" y1="140" x2="560" y2="140" stroke="rgba(74,170,210,0.05)" stroke-width="0.5"/>
            <line x1="280" y1="0" x2="280" y2="280" stroke="rgba(74,170,210,0.05)" stroke-width="0.5"/>

            <!-- Ground plane -->
            <rect x="0" y="240" width="560" height="40" fill="#06111C"/>
            <line x1="0" y1="240" x2="560" y2="240" stroke="rgba(61,201,160,0.15)" stroke-width="0.5"/>

            <!-- Main water supply pipeline — horizontal run -->
            <rect x="0" y="190" width="560" height="14" fill="#0D2235" stroke="#4AAAD2" stroke-width="1"/>
            <!-- Pipe flow direction arrows -->
            <polygon points="120,195 130,197 120,199" fill="rgba(74,170,210,0.4)"/>
            <polygon points="240,195 250,197 240,199" fill="rgba(74,170,210,0.4)"/>
            <polygon points="360,195 370,197 360,199" fill="rgba(74,170,210,0.4)"/>

            <!-- Distribution branches — vertical drops -->
            <g stroke="#3DC9A0" stroke-width="1" fill="none">
              <line x1="80" y1="190" x2="80" y2="240"/>
              <line x1="160" y1="190" x2="160" y2="240"/>
              <line x1="240" y1="190" x2="240" y2="240"/>
              <line x1="320" y1="190" x2="320" y2="240"/>
              <line x1="400" y1="190" x2="400" y2="240"/>
              <line x1="480" y1="190" x2="480" y2="240"/>
            </g>

            <!-- Household connection nodes -->
            <g fill="#0D2235" stroke="#3DC9A0" stroke-width="1">
              <circle cx="80" cy="244" r="5"/>
              <circle cx="160" cy="244" r="5"/>
              <circle cx="240" cy="244" r="5"/>
              <circle cx="320" cy="244" r="5"/>
              <circle cx="400" cy="244" r="5"/>
              <circle cx="480" cy="244" r="5"/>
            </g>

            <!-- Pumping station -->
            <rect x="30" y="148" width="60" height="40" fill="#0D2235" stroke="#4AAAD2" stroke-width="1"/>
            <rect x="38" y="155" width="16" height="16" fill="#091825" stroke="#4AAAD2" stroke-width="0.8" rx="8"/>
            <text x="60" y="163" font-family="'DM Mono', monospace" font-size="7" fill="rgba(74,170,210,0.7)">PUMP</text>
            <text x="60" y="172" font-family="'DM Mono', monospace" font-size="7" fill="rgba(74,170,210,0.5)">STN</text>
            <line x1="60" y1="188" x2="60" y2="204" stroke="#4AAAD2" stroke-width="1.2"/>

            <!-- Overhead tank -->
            <line x1="200" y1="60" x2="200" y2="148" stroke="#4AAAD2" stroke-width="1.2"/>
            <ellipse cx="200" cy="50" rx="28" ry="16" fill="#0D2235" stroke="#4AAAD2" stroke-width="1"/>
            <ellipse cx="200" cy="42" rx="28" ry="8" fill="#112840" stroke="#4AAAD2" stroke-width="0.8"/>
            <text x="200" y="47" font-family="'DM Mono', monospace" font-size="7" fill="rgba(74,170,210,0.7)" text-anchor="middle">OHT</text>
            <line x1="200" y1="148" x2="200" y2="190" stroke="#4AAAD2" stroke-width="1.2"/>

            <!-- Tube well -->
            <rect x="340" y="100" width="14" height="90" fill="#091825" stroke="#3DC9A0" stroke-width="0.8"/>
            <rect x="336" y="95" width="22" height="14" fill="#0D2235" stroke="#3DC9A0" stroke-width="0.8"/>
            <text x="365" y="146" font-family="'DM Mono', monospace" font-size="7" fill="rgba(61,201,160,0.6)">TUBE WELL</text>

            <!-- JJM FHTC count annotation -->
            <rect x="400" y="60" width="140" height="50" fill="rgba(7,15,24,0.8)" stroke="rgba(74,170,210,0.2)" stroke-width="0.5"/>
            <text x="412" y="76" font-family="'DM Mono', monospace" font-size="7" fill="rgba(74,170,210,0.6)" letter-spacing="0.08em">FHTC CONNECTIONS</text>
            <text x="412" y="90" font-family="'DM Mono', monospace" font-size="14" fill="#4AAAD2">2,847</text>
            <text x="412" y="103" font-family="'DM Mono', monospace" font-size="7" fill="rgba(200,225,248,0.3)">Kollam District · Phase I</text>

            <!-- Layer legend -->
            <g transform="translate(14, 14)">
              <rect x="0" y="0" width="8" height="5" fill="#4AAAD2" opacity="0.7"/>
              <text x="12" y="5" font-family="'DM Mono', monospace" font-size="7" fill="rgba(74,170,210,0.7)">WATER MAIN</text>
              <rect x="0" y="10" width="8" height="5" fill="#3DC9A0" opacity="0.7"/>
              <text x="12" y="15" font-family="'DM Mono', monospace" font-size="7" fill="rgba(61,201,160,0.7)">DISTRIBUTION</text>
              <rect x="0" y="20" width="8" height="5" fill="rgba(255,180,50,0.6)"/>
              <text x="12" y="25" font-family="'DM Mono', monospace" font-size="7" fill="rgba(255,180,50,0.6)">FHTC NODES</text>
            </g>

            <text x="14" y="268" font-family="'DM Mono', monospace" font-size="8" fill="rgba(74,170,210,0.4)" letter-spacing="0.1em">SCHEMATIC — PIPE NETWORK</text>
            <text x="14" y="278" font-family="'DM Mono', monospace" font-size="7" fill="rgba(200,225,248,0.2)" letter-spacing="0.08em">LOD 300 · JJM FRAMEWORK</text>
          </svg>